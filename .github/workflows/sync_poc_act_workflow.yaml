name: ⛙ Sync Workflow [POC Act Workflow]
run-name: Sync main into poc-act-workflow-sync
# Daily scheduled job that merges main into the poc-act-workflow-sync POC branch via a
# dedicated intermediate sync branch, gates on a lightweight lint check, then
# auto-approves and merges the resulting PR. Never pushes directly to
# poc-act-workflow-sync and never force-pushes (merge only, never rebase). This is
# scoped to one personal POC branch -- delete this file once the POC concludes or the
# branch merges into main.
#
# NOTE: schedule triggers only fire using the workflow file version on the repository's
# default branch (main) -- this file must land on main (via a normal PR) before the cron
# schedule actually activates. Until then, use workflow_dispatch to run it manually from
# this branch.

on:
  # schedule:
  #   - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

env:
  # This is the isolated LIA-jh-ds/GHA-testing sandbox repo -- 'dev' plays the role of
  # poc-act-workflow-sync (currently == main), 'tmp_target_branch' plays the role of
  # main (1 real commit ahead), and there are no repo secrets/vars configured here.
  TARGET_BRANCH: dev
  SYNC_BRANCH: sync/main-into-poc-act-workflow-sync
  # TESTING ONLY -- hardcoded to the disposable, remotely-pushed 'tmp_target_branch'
  # (1 commit ahead of main) instead of vars.MAIN_BRANCH, so a workflow_dispatch test
  # run can never merge/push/PR against the real main. Revert to vars.MAIN_BRANCH
  # before this workflow is used for real.
  TEST_SOURCE_BRANCH: tmp_target_branch

jobs:
  sync-branch:
    # No custom vars.DEFAULT_RUNNER/vars.DEFAULT_TIMEOUT in this basic sandbox repo --
    # hardcoded here instead (revert to the vars.*-based versions in the real repo).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      HAS_CHANGES: ${{ steps.merge.outputs.HAS_CHANGES }}
      PR_NUMBER: ${{ steps.pr.outputs.PR_NUMBER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ env.TEST_SOURCE_BRANCH }}
          fetch-depth: 0
          # No secrets.GHA_AUTOMATION here -- omitted so actions/checkout falls back to
          # its own default (the automatically-provided github.token), which is all
          # that's needed given the workflow-level `permissions: contents: write` above.

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge main into sync branch
        id: merge
        run: |
          git fetch origin "$TEST_SOURCE_BRANCH" "$TARGET_BRANCH"

          if git ls-remote --exit-code --heads origin "$SYNC_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$SYNC_BRANCH"
            git checkout -B "$SYNC_BRANCH" "origin/$SYNC_BRANCH"
          else
            git checkout -B "$SYNC_BRANCH" "origin/$TARGET_BRANCH"
          fi

          NEW_COMMITS=$(git rev-list --count "HEAD..origin/$TEST_SOURCE_BRANCH")
          if [[ "$NEW_COMMITS" -eq 0 ]]; then
            echo "'$TEST_SOURCE_BRANCH' has nothing new to sync into '$TARGET_BRANCH'."
            echo "HAS_CHANGES=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge --no-edit "origin/$TEST_SOURCE_BRANCH"; then
            git push origin "$SYNC_BRANCH"
            echo "HAS_CHANGES=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Merge conflict syncing '$TEST_SOURCE_BRANCH' into '$SYNC_BRANCH' -- aborting, manual resolution required."
            git merge --abort
            echo "HAS_CHANGES=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Open or reuse sync PR
        id: pr
        if: ${{ steps.merge.outputs.HAS_CHANGES == 'true' }}
        env:
          # Auto-provided default token -- no secrets.GHA_AUTOMATION in this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --repo "${{ github.repository }}" --head "$SYNC_BRANCH" --base "$TARGET_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING_PR" ]]; then
            echo "PR #$EXISTING_PR already open -- the push above already updated it."
            echo "PR_NUMBER=$EXISTING_PR" >> "$GITHUB_OUTPUT"
          else
            # No --label automerge here -- that label exists in the real repo
            # (auto_merge_pr_generate.yaml relies on it) but not in this basic sandbox
            # repo, and gh pr create fails if the label doesn't already exist.
            PR_URL=$(gh pr create --repo "${{ github.repository }}" \
              --title "[Automated] Sync '$TEST_SOURCE_BRANCH' into '$TARGET_BRANCH'" \
              --body "Automated daily sync. This PR brings '$TARGET_BRANCH' up to date with '$TEST_SOURCE_BRANCH'." \
              --head "$SYNC_BRANCH" \
              --base "$TARGET_BRANCH")
            echo "PR_NUMBER=$(basename "$PR_URL")" >> "$GITHUB_OUTPUT"
          fi

  auto-merge:
    needs:
      - sync-branch
    if: ${{ needs.sync-branch.outputs.HAS_CHANGES == 'true' && needs.sync-branch.outputs.PR_NUMBER != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      # No "Approve pull request" step here -- the real repo's PRORENATA_DEPLOY_TOKEN
      # is a *separate* bot identity specifically so it can approve a PR that
      # GHA_AUTOMATION opened (GitHub blocks self-approval outright). This sandbox has
      # only one identity (the default GITHUB_TOKEN) to work with, so approval can't be
      # meaningfully tested here -- skipping straight to merge, which doesn't require
      # prior approval unless branch protection demands it (unlikely on a basic repo).

      - name: Merge pull request
        env:
          # Auto-provided default token -- no secrets.GHA_AUTOMATION in this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.sync-branch.outputs.PR_NUMBER }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --merge --auto

  # conclude-workflow:
